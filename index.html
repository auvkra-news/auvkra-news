<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your News Channel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
  <div class="header-left">
    <img src="assets/logo.png" alt="AUVKRA NEWS Logo" class="logo">
    <h1 class="site-title">AUVKRA NEWS</h1>
  </div>
</header>

<main>
    <section class="breaking">
        <marquee>Breaking News: Welcome to Your News Channel Website</marquee>
    </section>

    <section class="news-container">
        <article class="news-card">
            <img src="https://via.placeholder.com/300x180" alt="news">
            <h3>Top Headline News</h3>
            <p>This is a short description of the news article.</p>
            <button>Read More</button>
        </article>

        <article class="news-card">
            <img src="https://via.placeholder.com/300x180" alt="news">
            <h3>Latest Updates</h3>
            <p>Important updates from around the world.</p>
            <button>Read More</button>
        </article>

        <article class="news-card">
            <img src="https://via.placeholder.com/300x180" alt="news">
            <h3>Sports News</h3>
            <p>All sports highlights in one place.</p>
            <button>Read More</button>
        </article>
    </section>
</main>

<footer>
    <p>© 2026 Your News Channel | All Rights Reserved</p>
</footer>

</body>
</html>
