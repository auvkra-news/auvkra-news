<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AUVKRA NEWS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">AUVKRA NEWS</div>
    <nav>
        <a data-en="Home" data-hi="होम">Home</a>
        <a data-en="National" data-hi="राष्ट्रीय">National</a>
        <a data-en="International" data-hi="अंतरराष्ट्रीय">International</a>
        <a data-en="Sports" data-hi="खेल">Sports</a>
        <a data-en="Technology" data-hi="तकनीक">Technology</a>
    </nav>
    <button class="lang-btn" onclick="toggleLanguage()">हिंदी</button>
</header>

<section class="breaking">
    <marquee data-en="Breaking News: Welcome to AUVKRA NEWS"
             data-hi="ब्रेकिंग न्यूज़: AUVKRA NEWS में आपका स्वागत है">
        Breaking News: Welcome to AUVKRA NEWS
    </marquee>
</section>

<section class="news-container">
    <div class="news-card">
        <h3 data-en="Top Headlines" data-hi="मुख्य समाचार">Top Headlines</h3>
        <p data-en="Latest news from India and world"
           data-hi="भारत और दुनिया की ताज़ा खबरें">
           Latest news from India and world
        </p>
    </div>

    <div class="news-card">
        <h3 data-en="Sports News" data-hi="खेल समाचार">Sports News</h3>
        <p data-en="Cricket, football and all sports updates"
           data-hi="क्रिकेट, फुटबॉल और सभी खेल अपडेट">
           Cricket, football and all sports updates
        </p>
    </div>
</section>

<footer>
    © 2026 AUVKRA NEWS
</footer>

<script src="script.js"></script>
</body>
</html>
